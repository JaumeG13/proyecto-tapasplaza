name: Inject Secrets and Deploy

on:
  push:
    branches:
      - main  # Triggers whenever you push code to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # This step searches your HTML file and replaces the placeholders with your Secrets
      - name: Inject Firebase Secrets
        run: |
          sed -i 's|%%API_KEY%%|${{ secrets.API_KEY }}|g' index.html
          sed -i 's|%%DB_URL%%|${{ secrets.DB_URL }}|g' index.html
          sed -i 's|%%PROJECT_ID%%|${{ secrets.PROJECT_ID }}|g' index.html

      # OPTIONAL: If you use GitHub Pages to host the dashboard, this deploys it automatically
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: . # Deploys the root folder containing your updated index.html
          branch: gh-pages # Deploys to a separate clean branch for hosting